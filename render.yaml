# Render Blueprint. Create via: Dashboard -> New -> Blueprint -> pick this repo.
# `sync: false` values are asked for once at creation time; they are never stored in git.
services:
  - type: web
    name: noux-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt            # closest listed region to Lagos
    plan: free                   # sleeps after 15 min idle (~1 min wake). Ping /healthz every ~10 min to keep it warm; upgrade to 0.5c-512mb ($7/mo) for always-on
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noux-db
          property: connectionString
      - key: PROGRAM_ID
        value: AC6AtoRALLszNGNLmHte2UXKzCqBYQKhPdtq5qs77nkL
      - key: CLUSTER
        value: devnet              # 'mainnet' later, with a fresh attribution key and its own campaigns
      - key: TRUST_PROXY
        value: "1"
      - key: RPC_URL
        sync: false
      - key: ATTRIBUTION_KEY_B58   # claim-signing key; fresh per cluster
        sync: false
      # Embedded settlement keeper (omit both to disable and run a separate worker instead)
      - key: MINT
        value: 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU   # devnet USDC
      - key: KEEPER_PAYER_B58      # small SOL float; can only settle after the hold, cannot refund
        sync: false

  # ---- sample merchant: a separate service that sells two clearly-labelled SAMPLE endpoints through the Noux gateway.
  # Keep the service name `noux-demo-merchant` (the directory listing points at https://noux-demo-merchant.onrender.com).
  - type: web
    name: noux-demo-merchant
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP                   # selects which app the shared image runs (see scripts/start.sh)
        value: demo-merchant
      - key: PROGRAM_ID
        value: AC6AtoRALLszNGNLmHte2UXKzCqBYQKhPdtq5qs77nkL
      - key: CLUSTER
        value: devnet
      - key: MINT
        value: 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU
      - key: FACILITATOR
        value: cdp
      - key: CLAIMS_API_URL
        value: https://noux-api.onrender.com
      - key: PUBLIC_URL
        value: https://noux-demo-merchant.onrender.com
      - key: RPC_URL
        sync: false
      - key: CAMPAIGN
        sync: false
      - key: MERCHANT_PAYTO
        sync: false
      - key: GATEWAY_PAYER_B58
        sync: false
      - key: MERCHANT_SIGNER_B58
        sync: false
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false

databases:
  - name: noux-db
    region: frankfurt
    plan: free                   # free Postgres EXPIRES after 30 days; upgrade before then if you keep it
